name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.8"
          cache: true

      - name: Generate the Android project
        run: |
          flutter create --platforms=android --org com.arnav --project-name dincharya /tmp/gen
          rm -rf android
          cp -r /tmp/gen/android ./android
          python3 tool/patch_android.py

      - name: Use the fixed signing key
        # The same key every build, so a new APK installs over the old one and keeps your data.
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dincharya-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk dincharya.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dincharya.apk --title "Dincharya (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download dincharya.apk on your phone and open it to install." \
            --target "$GITHUB_SHA"
